workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # GEMINI_API_KEY va GOOGLE_CLOUD_API_KEY CodeMagic UI'da
      # (App settings > Environment variables > "secure" belgisi bilan) qo'shilishi kerak —
      # bu yerga ochiq yozilmaydi.
      groups:
        - virtual_hamroh_secrets
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      # MUHIM: envied paketi --dart-define'ni EMAS, balki build paytida
      # mavjud bo'lgan haqiqiy .env faylni o'qiydi. Shuning uchun avval
      # CodeMagic'ning maxfiy environment variable'laridan .env yaratamiz.
      - name: Create .env file
        script: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "GEMINI_API_KEY_2=$GEMINI_API_KEY_2" >> .env
          echo "GOOGLE_CLOUD_API_KEY=$GOOGLE_CLOUD_API_KEY" >> .env

      # envied (Env klassi) va riverpod_generator .g.dart fayllarini
      # shu bosqichda generatsiya qiladi — bu fayllar repo'da yo'q,
      # shuning uchun bu qadam o'tkazib yuborilsa build xato beradi.
      - name: Generate code (envied + riverpod)
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        script: |
          flutter build apk --release

      - name: Build AppBundle (release, Play Store uchun)
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - payziyevdiyor@gmail.com
        notify:
          success: true
          failure: true
